name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to Ubuntu 26.04 (October 2026), which has no Python 3.9
        # build, and the package still supports 3.9 (requires-python in pyproject.toml).
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Test the installed package
        run: python -m pytest

  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publishing to PyPI with trusted publishing (no API token). To enable:
  #   1. On pypi.org, add a trusted publisher for project "calcbloc": owner itmarkerz,
  #      repository calcbloc-python, workflow tests.yml, environment pypi.
  #   2. Create the "pypi" environment in the repository settings (optionally with required reviewers).
